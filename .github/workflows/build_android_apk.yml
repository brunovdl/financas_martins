name: Build Android APK (MAI Finance)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do APK (opcional, padrão: 1.0.RUN_NUMBER)'
        required: false
        default: ''
      build_number:
        description: 'Número sequencial da build (opcional, padrão: run_number)'
        required: false
        default: ''
      create_release:
        description: 'Criar GitHub Release pública para download direto'
        type: boolean
        required: true
        default: true
  push:
    branches:
      - main
    paths:
      - 'mai_finance_flet/**'
      - '.github/workflows/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Diagnóstico das Ferramentas
        run: |
          flutter --version
          java -version
          python --version
          yes | flutter doctor --android-licenses || true

      - name: Instalar Dependências e Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet
          pip install -r mai_finance_flet/requirements.txt

      - name: Executar Build do APK Android
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd mai_finance_flet
          BUILD_NUMBER="${{ github.event.inputs.build_number || github.run_number }}"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${{ github.ref_name }}"
          else
            RAW_VERSION="1.0.${BUILD_NUMBER}"
          fi

          VERSION="${RAW_VERSION#v}"
          echo "Iniciando compilação do MAI Finance v${VERSION} (build ${BUILD_NUMBER})..."

          # Injetar a versão oficial calculada no código Python e no version.json para que o app saiba sua versão real
          python scripts/inject_version.py --version "${VERSION}" --build-number "${BUILD_NUMBER}"

          # Injetar GROQ_API_KEY se definida nos secrets do repositório
          if [ -n "${GROQ_API_KEY}" ]; then
            sed -i "s|DEFAULT_GROQ_API_KEY = .*|DEFAULT_GROQ_API_KEY = \"${GROQ_API_KEY}\"|g" config.py
            echo "Chave GROQ_API_KEY injetada com sucesso dos GitHub Secrets."
          fi

          # Configurar timeouts generosos para o Gradle para evitar falhas transitórias em downloads de rede
          mkdir -p ~/.gradle
          printf "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m\nsystemProp.http.connectionTimeout=60000\nsystemProp.http.socketTimeout=120000\nsystemProp.https.connectionTimeout=60000\nsystemProp.https.socketTimeout=120000\n" > ~/.gradle/gradle.properties

          build_success=0
          for attempt in 1 2; do
            echo "--- Compilação do APK: Tentativa $attempt de 2 ---"
            # Limpa qualquer resquício de compilações anteriores para evitar inconsistência de diretórios
            rm -rf build /tmp/serious_python_*

            if flet build apk \
              --yes \
              --no-rich-output \
              --module-name main \
              --python-version 3.12 \
              --project mai_finance \
              --product "MAI Finance" \
              --org com.martinsautomation \
              --company "Martins Automation" \
              --copyright "Copyright (c) 2026 Martins Automation" \
              --description "MAI Finance — Gestão Financeira Pessoal" \
              --build-version "${VERSION}" \
              --build-number "${BUILD_NUMBER}" \
              --android-adaptive-icon-background "#121828" \
              --splash-color "#121828" \
              --splash-dark-color "#121828" \
              --android-signing-key-store "$(pwd)/keystore/mai_finance.jks" \
              --android-signing-key-store-password "mai_finance_release_key_2026" \
              --android-signing-key-password "mai_finance_release_key_2026" \
              --android-signing-key-alias "maifinance" \
              --android-permissions android.permission.INTERNET=true android.permission.REQUEST_INSTALL_PACKAGES=true android.permission.CAMERA=true android.permission.ACCESS_FINE_LOCATION=true android.permission.ACCESS_COARSE_LOCATION=true android.permission.READ_EXTERNAL_STORAGE=true android.permission.WRITE_EXTERNAL_STORAGE=true \
              --exclude "tests/*" "Mai Finance QA.pdf" \
              --verbose; then
              build_success=1
              break
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "::warning::Falha na compilação do APK na tentativa $attempt. Limpando diretórios e aguardando 15 segundos antes de retentar..."
              sleep 15
            fi
          done

          if [ "$build_success" -ne 1 ]; then
            echo "::error::Falha ao compilar o APK após retentativas."
            exit 1
          fi

          # Localizar o arquivo APK gerado em build/apk
          APK_FILE=$(find build/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Arquivo APK não encontrado após o build!"
            exit 1
          fi

          DIST_NAME="MAI-Finance-v${VERSION}-build${BUILD_NUMBER}.apk"
          cp "$APK_FILE" "$DIST_NAME"
          echo "APK gerado com sucesso: $DIST_NAME"

          # Metadados dinâmicos para a Release
          APK_SIZE=$(du -h "$DIST_NAME" | cut -f1)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          BUILD_DATE=$(TZ="America/Sao_Paulo" date +"%d/%m/%Y %H:%M:%S" 2>/dev/null || date +"%d/%m/%Y %H:%M:%S")

          # Exportar variáveis para as próximas etapas
          echo "APK_DIST_PATH=mai_finance_flet/$DIST_NAME" >> $GITHUB_ENV
          echo "APK_FILENAME=$DIST_NAME" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUM=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Upload do APK como Artefato do Workflow
        uses: actions/upload-artifact@v4
        with:
          name: MAI-Finance-v${{ env.APP_VERSION }}-build${{ env.BUILD_NUM }}
          path: ${{ env.APK_DIST_PATH }}
          retention-days: 30

      - name: Criar ou Atualizar GitHub Release com APK
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release != 'false') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "MAI Finance v${{ env.APP_VERSION }} (Instalador Android)"
          body: |
            MAI Finance - Instalador Oficial Android (APK)

            Detalhes da versao:
            - Versao: v${{ env.APP_VERSION }}
            - Build: ${{ env.BUILD_NUM }}
            - Arquivo: ${{ env.APK_FILENAME }} (${{ env.APK_SIZE }})
            - Data de compilacao: ${{ env.BUILD_DATE }}
            - Commit: ${{ env.COMMIT_HASH }} - ${{ env.COMMIT_MSG }}
            - Autor: ${{ github.actor }}
            - Origem do disparo: ${{ github.event_name == 'push' && 'Commit automatico no branch main' || 'Disparo manual via workflow_dispatch' }}

            Instrucoes de instalacao:
            - Baixe o arquivo .apk anexado nesta versao diretamente no celular.
            - Toque na notificacao de conclusao de download ou acesse a pasta Downloads no seu gerenciador de arquivos.
            - Se solicitado pelo sistema Android, autorize a instalacao a partir desta fonte.
            - Conclua a instalacao e abra o MAI Finance com suas credenciais de acesso.
          files: ${{ env.APK_DIST_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
